name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache de Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Formato
        run: cargo fmt -- --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test

      - name: El motor de WebAssembly compila
        run: cargo build --lib --release --target wasm32-unknown-unknown

      - name: El módulo WebAssembly no pierde memoria
        run: node scripts/estres-wasm.mjs

  cobertura:
    # Job aparte: la cobertura informa, pero no bloquea la CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Instalar cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Medir la cobertura
        run: cargo llvm-cov --workspace --lcov --output-path cobertura.lcov

      - uses: actions/upload-artifact@v5
        with:
          name: cobertura
          path: cobertura.lcov
