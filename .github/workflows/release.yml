name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binarios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            nombre: phishing-analyzer-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            nombre: phishing-analyzer-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            nombre: phishing-analyzer-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            nombre: phishing-analyzer-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            nombre: phishing-analyzer-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache de Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/phishing-analyzer"* "dist/${{ matrix.nombre }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: dist/${{ matrix.nombre }}

  release:
    needs: binarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sumas de comprobación
        shell: bash
        run: |
          cd dist
          sha256sum * > phishing-analyzer-SHA256SUMS.txt
          cat phishing-analyzer-SHA256SUMS.txt

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Analizador de phishing ${GITHUB_REF_NAME}" \
            --notes "Binarios del analizador de phishing: análisis estático de enlaces, sin visitarlos. \
          Verifique las descargas con el archivo \`phishing-analyzer-SHA256SUMS.txt\`."
